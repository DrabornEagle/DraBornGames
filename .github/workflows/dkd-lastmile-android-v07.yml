name: DKD Last Mile Android v0.7.5

on:
  workflow_dispatch:
    inputs:
      dkd_output:
        description: Android çıktısı
        required: true
        default: development
        type: choice
        options:
          - development
          - apk
          - aab

permissions:
  contents: read

concurrency:
  group: dkd-lastmile-android-v075-${{ inputs.dkd_output }}
  cancel-in-progress: false

jobs:
  dkd-android:
    name: LastMile v0.7.5 · ${{ inputs.dkd_output }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: LastMile
    env:
      NODE_ENV: production
      DKD_LASTMILE_KEYSTORE_PATH: ${{ github.workspace }}/LastMile/android/app/dkd-lastmile-release.jks

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: LastMile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Expo candidate source
        run: |
          npm run build:game
          npm test
          npm run typecheck
          EXPO_OFFLINE=1 npx expo install --check
      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean
      - name: Require and restore permanent signing key
        env:
          DKD_LASTMILE_KEYSTORE_B64: ${{ secrets.DKD_LASTMILE_KEYSTORE_B64 }}
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
          DKD_LASTMILE_KEY_PASSWORD: ${{ secrets.DKD_LASTMILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${DKD_LASTMILE_KEYSTORE_B64:-}"
          test -n "${DKD_LASTMILE_KEYSTORE_PASSWORD:-}"
          test -n "${DKD_LASTMILE_KEY_ALIAS:-}"
          test -n "${DKD_LASTMILE_KEY_PASSWORD:-}"
          printf '%s' "$DKD_LASTMILE_KEYSTORE_B64" | base64 --decode > "$DKD_LASTMILE_KEYSTORE_PATH"
          chmod 600 "$DKD_LASTMILE_KEYSTORE_PATH"
          keytool -list -keystore "$DKD_LASTMILE_KEYSTORE_PATH" -storepass "$DKD_LASTMILE_KEYSTORE_PASSWORD" -alias "$DKD_LASTMILE_KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          dkd_file = Path('android/app/build.gradle')
          dkd_source = dkd_file.read_text()
          dkd_replacements = {
              "storeFile file('debug.keystore')": 'storeFile file(System.getenv("DKD_LASTMILE_KEYSTORE_PATH"))',
              "storePassword 'android'": 'storePassword System.getenv("DKD_LASTMILE_KEYSTORE_PASSWORD")',
              "keyAlias 'androiddebugkey'": 'keyAlias System.getenv("DKD_LASTMILE_KEY_ALIAS")',
              "keyPassword 'android'": 'keyPassword System.getenv("DKD_LASTMILE_KEY_PASSWORD")',
          }
          for dkd_old, dkd_new in dkd_replacements.items():
              if dkd_old not in dkd_source:
                  raise SystemExit(f'Android signing satırı bulunamadı: {dkd_old}')
              dkd_source = dkd_source.replace(dkd_old, dkd_new, 1)
          dkd_file.write_text(dkd_source)
          PY
      - name: Build selected Android output
        env:
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
          DKD_LASTMILE_KEY_PASSWORD: ${{ secrets.DKD_LASTMILE_KEY_PASSWORD }}
          DKD_OUTPUT: ${{ inputs.dkd_output }}
        run: |
          set -euo pipefail
          cd android
          case "$DKD_OUTPUT" in
            development) ./gradlew :app:assembleDebug --no-daemon --stacktrace ;;
            apk) ./gradlew :app:assembleRelease --no-daemon --stacktrace ;;
            aab) ./gradlew :app:bundleRelease --no-daemon --stacktrace ;;
            *) exit 22 ;;
          esac
      - name: Package and verify output
        env:
          DKD_OUTPUT: ${{ inputs.dkd_output }}
        run: |
          set -euo pipefail
          mkdir -p dist-android
          dkd_apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          case "$DKD_OUTPUT" in
            development)
              dkd_source='android/app/build/outputs/apk/debug/app-debug.apk'
              dkd_name='LastMile-v0.7.5-development-vc1.apk'
              ;;
            apk)
              dkd_source='android/app/build/outputs/apk/release/app-release.apk'
              dkd_name='LastMile-v0.7.5-release-vc1.apk'
              ;;
            aab)
              dkd_source='android/app/build/outputs/bundle/release/app-release.aab'
              dkd_name='LastMile-v0.7.5-release-vc1.aab'
              ;;
          esac
          test -f "$dkd_source"
          cp "$dkd_source" "dist-android/$dkd_name"
          sha256sum "dist-android/$dkd_name" > "dist-android/$dkd_name.sha256"
          if [[ "$dkd_name" == *.apk ]]; then
            "$dkd_apksigner" verify --verbose --print-certs "dist-android/$dkd_name" > dist-android/SIGNATURE.txt
          fi
          printf 'DraBornGo / LastMile\nversionName=0.7.5\nversionCode=1\npackage=com.draborneagle.lastmile\nExpo SDK=57\noutput=%s\nsigning=DKD_LASTMILE permanent JKS\n' "$DKD_OUTPUT" > dist-android/BUILD-INFO.txt
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: dkd-lastmile-v0.7.5-${{ inputs.dkd_output }}-vc1
          path: LastMile/dist-android/
          if-no-files-found: error
          retention-days: 30
