name: DKD Last Mile Signed Android Output

on:
  workflow_dispatch:
    inputs:
      dkd_format:
        description: 'Çıktı biçimi'
        required: true
        default: 'aab'
        type: choice
        options:
          - apk
          - aab

permissions:
  contents: read

concurrency:
  group: dkd-lastmile-signed-${{ inputs.dkd_format }}
  cancel-in-progress: false

jobs:
  dkd-signed-output:
    name: Permanent-key ${{ inputs.dkd_format }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: DraBornGo-LastMile
    env:
      DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
      DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
      DKD_LASTMILE_KEY_PASSWORD: ${{ secrets.DKD_LASTMILE_KEY_PASSWORD }}
      DKD_LASTMILE_KEYSTORE_PATH: ${{ github.workspace }}/DraBornGo-LastMile/android/app/dkd-lastmile-release.jks

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DraBornGo-LastMile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Require permanent signing identity
        env:
          DKD_LASTMILE_KEYSTORE_B64: ${{ secrets.DKD_LASTMILE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for dkd_secret in DKD_LASTMILE_KEYSTORE_B64 DKD_LASTMILE_KEYSTORE_PASSWORD DKD_LASTMILE_KEY_ALIAS DKD_LASTMILE_KEY_PASSWORD; do
            test -n "${!dkd_secret:-}" || { echo "$dkd_secret secret eksik."; exit 20; }
          done

      - name: Verify JavaScript release state
        run: |
          npm ci --no-audit --no-fund
          npm run build:game
          npm test
          npm run typecheck
          EXPO_OFFLINE=1 npx expo install --check

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Restore and verify permanent key
        env:
          DKD_LASTMILE_KEYSTORE_B64: ${{ secrets.DKD_LASTMILE_KEYSTORE_B64 }}
        run: |
          printf '%s' "$DKD_LASTMILE_KEYSTORE_B64" | base64 --decode > "$DKD_LASTMILE_KEYSTORE_PATH"
          chmod 600 "$DKD_LASTMILE_KEYSTORE_PATH"
          keytool -list -keystore "$DKD_LASTMILE_KEYSTORE_PATH" -storepass "$DKD_LASTMILE_KEYSTORE_PASSWORD" -alias "$DKD_LASTMILE_KEY_ALIAS" >/dev/null

      - name: Force generated Android signing config to permanent key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dkd_file = Path('android/app/build.gradle')
          dkd_source = dkd_file.read_text()
          dkd_replacements = {
              "storeFile file('debug.keystore')": 'storeFile file(System.getenv("DKD_LASTMILE_KEYSTORE_PATH"))',
              "storePassword 'android'": 'storePassword System.getenv("DKD_LASTMILE_KEYSTORE_PASSWORD")',
              "keyAlias 'androiddebugkey'": 'keyAlias System.getenv("DKD_LASTMILE_KEY_ALIAS")',
              "keyPassword 'android'": 'keyPassword System.getenv("DKD_LASTMILE_KEY_PASSWORD")',
          }
          for dkd_old, dkd_new in dkd_replacements.items():
              if dkd_old not in dkd_source:
                  raise SystemExit(f'İmzalama satırı bulunamadı: {dkd_old}')
              dkd_source = dkd_source.replace(dkd_old, dkd_new, 1)
          dkd_file.write_text(dkd_source)
          PY

      - name: Build signed Android output
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cd android
          if [[ '${{ inputs.dkd_format }}' == 'apk' ]]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../dist-android/DraBornGo-LastMile-v0.7.0-release-vc1.apk
          else
            ./gradlew :app:bundleRelease --no-daemon --stacktrace
            cp app/build/outputs/bundle/release/app-release.aab ../dist-android/DraBornGo-LastMile-v0.7.0-release-vc1.aab
          fi

      - name: Record hashes and certificate identity
        run: |
          set -euo pipefail
          sha256sum dist-android/DraBornGo-LastMile-v0.7.0-release-vc1.* > dist-android/SHA256SUMS.txt
          keytool -list -v -keystore "$DKD_LASTMILE_KEYSTORE_PATH" -storepass "$DKD_LASTMILE_KEYSTORE_PASSWORD" -alias "$DKD_LASTMILE_KEY_ALIAS" | grep -E 'Alias name:|SHA256:' > dist-android/SIGNING-IDENTITY.txt
          printf 'versionName=0.7.0\nversionCode=1\npackage=com.draborneagle.lastmile\nformat=${{ inputs.dkd_format }}\nsigning=DKD_LASTMILE permanent keystore\n' > dist-android/BUILD-INFO.txt

      - name: Upload signed output
        uses: actions/upload-artifact@v4
        with:
          name: dkd-lastmile-v0.7.0-signed-${{ inputs.dkd_format }}-vc1
          path: |
            DraBornGo-LastMile/dist-android/*
          if-no-files-found: error
          retention-days: 30
