name: DKD Last Mine Signed Android Release v0.7.5

on:
  push:
    branches: [main]
    paths:
      - 'LastMile/dkd-release-request.json'
  workflow_dispatch:
    inputs:
      dkd_format:
        description: 'Çıktı biçimi'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
      dkd_publish_github_release:
        description: 'APK için GitHub Release oluştur'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dkd-lastmine-signed-v075-${{ inputs.dkd_format || 'apk' }}
  cancel-in-progress: false

jobs:
  dkd-signed-output:
    name: Permanent-key ${{ inputs.dkd_format || 'apk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: LastMile
    env:
      DKD_OUTPUT_FORMAT: ${{ inputs.dkd_format || 'apk' }}
      DKD_LASTMILE_KEYSTORE_PATH: ${{ github.workspace }}/LastMile/android/app/dkd-lastmile-release.jks

    steps:
      - uses: actions/checkout@v5
      - name: Read shared version
        run: echo "DKD_VERSION=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_ENV"
      - name: Require permanent signing identity
        env:
          DKD_LASTMILE_KEYSTORE_B64: ${{ secrets.DKD_LASTMILE_KEYSTORE_B64 }}
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
          DKD_LASTMILE_KEY_PASSWORD: ${{ secrets.DKD_LASTMILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for dkd_secret in DKD_LASTMILE_KEYSTORE_B64 DKD_LASTMILE_KEYSTORE_PASSWORD DKD_LASTMILE_KEY_ALIAS DKD_LASTMILE_KEY_PASSWORD; do
            test -n "${!dkd_secret:-}" || { echo "$dkd_secret secret eksik."; exit 20; }
          done
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: LastMile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate deterministic Last Mine Android icon
        run: python3 scripts/dkd-generate-android-icon.py
      - name: Verify JavaScript release state
        run: |
          npm ci --no-audit --no-fund
          npm run build:game
          npm test
          npm run typecheck
          EXPO_OFFLINE=1 npx expo install --check
      - name: Remove development client from standalone release
        run: npm uninstall expo-dev-client --no-audit --no-fund
      - name: Generate Android project
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean
      - name: Restore and verify permanent key
        env:
          DKD_LASTMILE_KEYSTORE_B64: ${{ secrets.DKD_LASTMILE_KEYSTORE_B64 }}
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
        run: |
          printf '%s' "$DKD_LASTMILE_KEYSTORE_B64" | base64 --decode > "$DKD_LASTMILE_KEYSTORE_PATH"
          chmod 600 "$DKD_LASTMILE_KEYSTORE_PATH"
          keytool -list -keystore "$DKD_LASTMILE_KEYSTORE_PATH" -storepass "$DKD_LASTMILE_KEYSTORE_PASSWORD" -alias "$DKD_LASTMILE_KEY_ALIAS" >/dev/null
      - name: Force generated Android signing config to permanent key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dkd_file = Path('android/app/build.gradle')
          dkd_source = dkd_file.read_text()
          dkd_replacements = {
              "storeFile file('debug.keystore')": 'storeFile file(System.getenv("DKD_LASTMILE_KEYSTORE_PATH"))',
              "storePassword 'android'": 'storePassword System.getenv("DKD_LASTMILE_KEYSTORE_PASSWORD")',
              "keyAlias 'androiddebugkey'": 'keyAlias System.getenv("DKD_LASTMILE_KEY_ALIAS")',
              "keyPassword 'android'": 'keyPassword System.getenv("DKD_LASTMILE_KEY_PASSWORD")',
          }
          for dkd_old, dkd_new in dkd_replacements.items():
              if dkd_old not in dkd_source:
                  raise SystemExit(f'İmzalama satırı bulunamadı: {dkd_old}')
              dkd_source = dkd_source.replace(dkd_old, dkd_new, 1)
          dkd_file.write_text(dkd_source)
          PY
      - name: Build signed Android output
        env:
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
          DKD_LASTMILE_KEY_PASSWORD: ${{ secrets.DKD_LASTMILE_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cd android
          if [[ "$DKD_OUTPUT_FORMAT" == 'apk' ]]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
            cp app/build/outputs/apk/release/app-release.apk ../dist-android/Last-Mine-v${DKD_VERSION}-release-vc1.apk
          else
            ./gradlew :app:bundleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
            cp app/build/outputs/bundle/release/app-release.aab ../dist-android/Last-Mine-v${DKD_VERSION}-release-vc1.aab
          fi
      - name: Verify signed APK version name and icon
        if: env.DKD_OUTPUT_FORMAT == 'apk'
        run: |
          set -euo pipefail
          dkd_tools="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$dkd_tools" verify --verbose --print-certs dist-android/*.apk > dist-android/SIGNING-IDENTITY.txt
          grep -qi 'b3042b120c61c1deec8cc2619c5513c4f7b3378d81c6235e9285ccf6069609bc' dist-android/SIGNING-IDENTITY.txt
          "$(dirname "$dkd_tools")/aapt" dump badging dist-android/*.apk > dist-android/BUILD-INFO.txt
          grep -q "versionCode='1'" dist-android/BUILD-INFO.txt
          grep -q "versionName='$DKD_VERSION'" dist-android/BUILD-INFO.txt
          grep -q "name='com.draborneagle.lastmile'" dist-android/BUILD-INFO.txt
          grep -q "application-label:'Last Mine'" dist-android/BUILD-INFO.txt
          grep -q "application-icon-" dist-android/BUILD-INFO.txt
          if grep -q "application-debuggable" dist-android/BUILD-INFO.txt; then exit 46; fi
      - name: Record hashes and certificate identity
        env:
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          sha256sum dist-android/Last-Mine-v${DKD_VERSION}-release-vc1.* > dist-android/SHA256SUMS.txt
          keytool -list -v -keystore "$DKD_LASTMILE_KEYSTORE_PATH" -storepass "$DKD_LASTMILE_KEYSTORE_PASSWORD" -alias "$DKD_LASTMILE_KEY_ALIAS" | grep -E 'Alias name:|SHA256:' > dist-android/SIGNING-IDENTITY.txt
          printf 'appName=Last Mine\nversionName=%s\nversionCode=1\nsourceCommit=%s\ndistribution=web-and-github\n' "$DKD_VERSION" "$GITHUB_SHA" > dist-android/RELEASE-INFO.txt
      - name: Upload signed output
        uses: actions/upload-artifact@v4
        with:
          name: dkd-lastmine-v${{ env.DKD_VERSION }}-signed-${{ env.DKD_OUTPUT_FORMAT }}-vc1
          path: LastMile/dist-android/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release for website download
        if: env.DKD_OUTPUT_FORMAT == 'apk' && (github.event_name == 'push' || inputs.dkd_publish_github_release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dkd_version="$(node -p "require('./app.json').expo.version")"
          dkd_tag="lastmine-v${dkd_version}-${GITHUB_SHA:0:12}"
          gh release create "$dkd_tag" dist-android/* --target "$GITHUB_SHA" --title "Last Mine v${dkd_version} · Android Release" --notes-file dist-android/RELEASE-INFO.txt --latest
