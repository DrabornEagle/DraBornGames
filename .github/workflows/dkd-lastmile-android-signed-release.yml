name: DKD Last Mile Signed Android Output

on:
  push:
    branches:
      - main
    paths:
      - 'DraBornGo-LastMile/.dkd-build-play-aab-v07'
  workflow_dispatch:
    inputs:
      dkd_format:
        description: 'Çıktı biçimi'
        required: true
        default: 'aab'
        type: choice
        options:
          - apk
          - aab

permissions:
  contents: read

concurrency:
  group: dkd-lastmile-signed-${{ github.event_name == 'workflow_dispatch' && inputs.dkd_format || 'aab' }}
  cancel-in-progress: false

jobs:
  dkd-signed-output:
    name: Permanent-key ${{ github.event_name == 'workflow_dispatch' && inputs.dkd_format || 'aab' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: DraBornGo-LastMile
    env:
      DKD_OUTPUT_FORMAT: ${{ github.event_name == 'workflow_dispatch' && inputs.dkd_format || 'aab' }}
      DKD_LASTMILE_KEYSTORE_PATH: ${{ github.workspace }}/DraBornGo-LastMile/android/app/dkd-lastmile-release.jks

    steps:
      - uses: actions/checkout@v5

      - name: Require permanent signing identity
        env:
          DKD_LASTMILE_KEYSTORE_B64: ${{ secrets.DKD_LASTMILE_KEYSTORE_B64 }}
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
          DKD_LASTMILE_KEY_PASSWORD: ${{ secrets.DKD_LASTMILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for dkd_secret in DKD_LASTMILE_KEYSTORE_B64 DKD_LASTMILE_KEYSTORE_PASSWORD DKD_LASTMILE_KEY_ALIAS DKD_LASTMILE_KEY_PASSWORD; do
            test -n "${!dkd_secret:-}" || { echo "$dkd_secret secret eksik."; exit 20; }
          done

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DraBornGo-LastMile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify JavaScript release state
        run: |
          npm ci --no-audit --no-fund
          npm run build:game
          npm test
          npm run typecheck
          EXPO_OFFLINE=1 npx expo install --check

      - name: Prepare Google Play policy variant
        if: env.DKD_OUTPUT_FORMAT == 'aab'
        run: |
          set -euo pipefail
          node scripts/dkd-prepare-google-play.mjs
          grep -q 'window.dkd_googlePlayBuild=true;' assets/dkd-lastmile.html
          grep -q 'window.dkd_googlePlayBuild=true;' src/generated/dkd-game-html.ts
          node - <<'NODE'
          const dkd_app = require('./app.json').expo;
          if (dkd_app.android.package !== 'com.draborneagle.lastmile') throw new Error('Google Play paket adı değişti.');
          if (dkd_app.android.versionCode !== 1 || dkd_app.version !== '0.7.0') throw new Error('Google Play sürüm kimliği beklenmiyor.');
          if (dkd_app.extra.dkd_realRewardsEnabled !== false) throw new Error('Google Play gerçek dünya ödül koruması aktif değil.');
          if (dkd_app.extra.dkd_googlePlayRewardsMode !== 'virtual-only') throw new Error('Google Play ödül modu virtual-only değil.');
          NODE
          npm run typecheck

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Restore and verify permanent key
        env:
          DKD_LASTMILE_KEYSTORE_B64: ${{ secrets.DKD_LASTMILE_KEYSTORE_B64 }}
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
        run: |
          printf '%s' "$DKD_LASTMILE_KEYSTORE_B64" | base64 --decode > "$DKD_LASTMILE_KEYSTORE_PATH"
          chmod 600 "$DKD_LASTMILE_KEYSTORE_PATH"
          keytool -list -keystore "$DKD_LASTMILE_KEYSTORE_PATH" -storepass "$DKD_LASTMILE_KEYSTORE_PASSWORD" -alias "$DKD_LASTMILE_KEY_ALIAS" >/dev/null

      - name: Force generated Android signing config to permanent key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dkd_file = Path('android/app/build.gradle')
          dkd_source = dkd_file.read_text()
          dkd_replacements = {
              "storeFile file('debug.keystore')": 'storeFile file(System.getenv("DKD_LASTMILE_KEYSTORE_PATH"))',
              "storePassword 'android'": 'storePassword System.getenv("DKD_LASTMILE_KEYSTORE_PASSWORD")',
              "keyAlias 'androiddebugkey'": 'keyAlias System.getenv("DKD_LASTMILE_KEY_ALIAS")',
              "keyPassword 'android'": 'keyPassword System.getenv("DKD_LASTMILE_KEY_PASSWORD")',
          }
          for dkd_old, dkd_new in dkd_replacements.items():
              if dkd_old not in dkd_source:
                  raise SystemExit(f'İmzalama satırı bulunamadı: {dkd_old}')
              dkd_source = dkd_source.replace(dkd_old, dkd_new, 1)
          dkd_file.write_text(dkd_source)
          PY

      - name: Build signed Android output
        env:
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
          DKD_LASTMILE_KEY_PASSWORD: ${{ secrets.DKD_LASTMILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist-android
          cd android
          if [[ "$DKD_OUTPUT_FORMAT" == 'apk' ]]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk ../dist-android/DraBornGo-LastMile-v0.7.0-release-vc1.apk
          else
            ./gradlew :app:bundleRelease --no-daemon --stacktrace
            cp app/build/outputs/bundle/release/app-release.aab ../dist-android/DraBornGo-LastMile-v0.7.0-release-vc1.aab
          fi

      - name: Google Play AAB postflight
        if: env.DKD_OUTPUT_FORMAT == 'aab'
        env:
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          dkd_aab='dist-android/DraBornGo-LastMile-v0.7.0-release-vc1.aab'
          jarsigner -verify -certs "$dkd_aab" >/dev/null

          dkd_expected_fingerprint='B3:04:2B:12:0C:61:C1:DE:EC:8C:C2:61:9C:55:13:C4:F7:B3:37:8D:81:C6:23:5E:92:85:CC:F6:06:96:09:BC'
          dkd_keystore_fingerprint="$(keytool -list -v -keystore "$DKD_LASTMILE_KEYSTORE_PATH" -storepass "$DKD_LASTMILE_KEYSTORE_PASSWORD" -alias "$DKD_LASTMILE_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          dkd_aab_fingerprint="$(keytool -printcert -jarfile "$dkd_aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          [[ "$dkd_keystore_fingerprint" == "$dkd_expected_fingerprint" ]] || { echo 'Kalıcı JKS sertifika parmak izi beklenen kimlikle eşleşmiyor.'; exit 44; }
          [[ "$dkd_aab_fingerprint" == "$dkd_expected_fingerprint" ]] || { echo 'AAB kalıcı Last Mile sertifikasıyla imzalanmamış.'; exit 45; }

          dkd_bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl -fsSL --retry 3 --retry-delay 2 -o "$dkd_bundletool" 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar'
          java -jar "$dkd_bundletool" dump manifest --bundle="$dkd_aab" > dist-android/PLAY-MANIFEST.xml
          dkd_target="$(java -jar "$dkd_bundletool" dump manifest --bundle="$dkd_aab" --xpath='/manifest/uses-sdk/@android:targetSdkVersion' | tr -d '\r\n[:space:]')"
          dkd_version_code="$(java -jar "$dkd_bundletool" dump manifest --bundle="$dkd_aab" --xpath='/manifest/@android:versionCode' | tr -d '\r\n[:space:]')"
          [[ "$dkd_target" == '36' ]] || { echo "AAB targetSdkVersion beklenen 36 değil: $dkd_target"; exit 41; }
          [[ "$dkd_version_code" == '1' ]] || { echo "AAB versionCode beklenen 1 değil: $dkd_version_code"; exit 42; }
          grep -q 'package="com.draborneagle.lastmile"' dist-android/PLAY-MANIFEST.xml
          for dkd_permission in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CAMERA RECORD_AUDIO READ_CONTACTS READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE; do
            if grep -q "android.permission.$dkd_permission" dist-android/PLAY-MANIFEST.xml; then
              echo "Gereksiz hassas izin final AAB manifestinde kaldı: $dkd_permission"
              exit 43
            fi
          done

          unzip -l "$dkd_aab" | grep -qE 'base/lib/arm64-v8a/.*\.so'
          mkdir -p "$RUNNER_TEMP/dkd-aab-native"
          unzip -q "$dkd_aab" 'base/lib/arm64-v8a/*.so' 'base/lib/x86_64/*.so' -d "$RUNNER_TEMP/dkd-aab-native" || true
          DKD_NATIVE_ROOT="$RUNNER_TEMP/dkd-aab-native" python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess
          dkd_root = Path(os.environ['DKD_NATIVE_ROOT'])
          dkd_bad = []
          dkd_checked = 0
          for dkd_so in dkd_root.rglob('*.so'):
              dkd_checked += 1
              dkd_output = subprocess.check_output(['readelf', '-lW', str(dkd_so)], text=True, errors='ignore')
              dkd_alignments = []
              for dkd_line in dkd_output.splitlines():
                  if dkd_line.lstrip().startswith('LOAD'):
                      dkd_match = re.search(r'(0x[0-9a-fA-F]+)\s*$', dkd_line)
                      if dkd_match:
                          dkd_alignments.append(int(dkd_match.group(1), 16))
              if dkd_alignments and min(dkd_alignments) < 0x4000:
                  dkd_bad.append(f'{dkd_so.name}: min LOAD align={hex(min(dkd_alignments))}')
          if dkd_checked == 0:
              raise SystemExit('64-bit native kitaplık bulunamadı.')
          if dkd_bad:
              raise SystemExit('16 KB sayfa hizalama kontrolü başarısız:\n' + '\n'.join(dkd_bad))
          Path('dist-android/PLAY-16KB-CHECK.txt').write_text(f'PASS\n64-bit ELF checked={dkd_checked}\nminimum required LOAD alignment=0x4000\n')
          print(f'16 KB page-size postflight başarılı: {dkd_checked} adet 64-bit ELF kontrol edildi.')
          PY
          printf 'PASS\ntargetSdkVersion=36\nversionCode=1\npackage=com.draborneagle.lastmile\nforbiddenSensitivePermissions=none\nsignerSHA256=%s\n' "$dkd_aab_fingerprint" > dist-android/PLAY-AAB-CHECK.txt

      - name: Record hashes and certificate identity
        env:
          DKD_LASTMILE_KEYSTORE_PASSWORD: ${{ secrets.DKD_LASTMILE_KEYSTORE_PASSWORD }}
          DKD_LASTMILE_KEY_ALIAS: ${{ secrets.DKD_LASTMILE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          sha256sum dist-android/DraBornGo-LastMile-v0.7.0-release-vc1.* > dist-android/SHA256SUMS.txt
          keytool -list -v -keystore "$DKD_LASTMILE_KEYSTORE_PATH" -storepass "$DKD_LASTMILE_KEYSTORE_PASSWORD" -alias "$DKD_LASTMILE_KEY_ALIAS" | grep -E 'Alias name:|SHA256:' > dist-android/SIGNING-IDENTITY.txt
          if [[ "$DKD_OUTPUT_FORMAT" == 'aab' ]]; then
            cp docs/dkd-google-play-v07.md dist-android/PLAY-CONSOLE-CHECKLIST.md
            printf 'versionName=0.7.0\nversionCode=1\npackage=com.draborneagle.lastmile\nformat=aab\ntargetSdkVersion=36\nplayRewardMode=virtual-only\nprivacy=https://www.draborneagle.com/draborngo/lastmile/gizlilik/\naccountDeletion=https://www.draborneagle.com/draborngo/lastmile/hesap-silme/\nsigning=DKD_LASTMILE permanent keystore\n' > dist-android/BUILD-INFO.txt
          else
            printf 'versionName=0.7.0\nversionCode=1\npackage=com.draborneagle.lastmile\nformat=apk\nsigning=DKD_LASTMILE permanent keystore\n' > dist-android/BUILD-INFO.txt
          fi

      - name: Upload signed output
        uses: actions/upload-artifact@v4
        with:
          name: dkd-lastmile-v0.7.0-signed-${{ env.DKD_OUTPUT_FORMAT }}-vc1
          path: |
            DraBornGo-LastMile/dist-android/*
          if-no-files-found: error
          retention-days: 30
