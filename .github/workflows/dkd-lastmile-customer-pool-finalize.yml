name: DKD Last Mile customer pool finalize

on:
  push:
    branches:
      - work/DraBornGo-LastMile-v0.6-customer-pool
    paths:
      - '.github/workflows/dkd-lastmile-customer-pool-finalize.yml'

permissions:
  contents: write

concurrency:
  group: dkd-lastmile-customer-pool-finalize
  cancel-in-progress: true

jobs:
  dkd-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DraBornGo-LastMile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/DraBornGo-LastMile-v0.6-customer-pool
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DraBornGo-LastMile/package-lock.json
      - name: Complete 47-portrait wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const dkd_runtimePath = 'game/dkd-v06-customer-pool.mjs';
          const dkd_buildPath = 'scripts/dkd-build-game.mjs';
          const dkd_testPath = 'tests/dkd-v06-customer-pool.test.mjs';

          let dkd_runtime = fs.readFileSync(dkd_runtimePath, 'utf8');
          if (!dkd_runtime.includes('dkd_v06CustomerPortraitPoolPart08')) {
            const dkd_runtimeNeedle = '  ...dkd_v06CustomerPortraitPoolPart07,\n].filter(Boolean)))';
            if (!dkd_runtime.includes(dkd_runtimeNeedle)) throw new Error('Runtime portrait insertion point not found');
            dkd_runtime = dkd_runtime.replace(
              dkd_runtimeNeedle,
              '  ...dkd_v06CustomerPortraitPoolPart07,\n  ...dkd_v06CustomerPortraitPoolPart08,\n].filter(Boolean)))'
            );
            fs.writeFileSync(dkd_runtimePath, dkd_runtime);
          }

          let dkd_build = fs.readFileSync(dkd_buildPath, 'utf8');
          if (!dkd_build.includes("'avatars/pool/dkd_customer_pool_08.mjs'")) {
            const dkd_buildNeedle = "  'avatars/pool/dkd_customer_pool_07.mjs',\n  'dkd-v06-customer-pool.mjs'";
            if (!dkd_build.includes(dkd_buildNeedle)) throw new Error('Build portrait insertion point not found');
            dkd_build = dkd_build.replace(
              dkd_buildNeedle,
              "  'avatars/pool/dkd_customer_pool_07.mjs',\n  'avatars/pool/dkd_customer_pool_08.mjs',\n  'dkd-v06-customer-pool.mjs'"
            );
            fs.writeFileSync(dkd_buildPath, dkd_build);
          }

          let dkd_test = fs.readFileSync(dkd_testPath, 'utf8');
          dkd_test = dkd_test.replace('Array.from({ length: 8 }', 'Array.from({ length: 9 }');
          dkd_test = dkd_test.replace('dkd_index < 8', 'dkd_index < 9');
          fs.writeFileSync(dkd_testPath, dkd_test);
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run build:game
      - run: npm test
      - run: npm run typecheck
      - name: Expo SDK dependency versions
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: JavaScript whitespace check
        run: git diff --check
      - name: Commit final generated bundle
        run: |
          git config user.name 'DKD Last Mile Bot'
          git config user.email 'dkd-lastmile-bot@users.noreply.github.com'
          git add game/dkd-v06-customer-pool.mjs scripts/dkd-build-game.mjs tests/dkd-v06-customer-pool.test.mjs assets/dkd-lastmile.html src/generated/dkd-game-html.ts
          if git diff --cached --quiet; then
            echo 'Customer pool already finalized.'
            exit 0
          fi
          git commit -m 'fix(lastmile): wire all 47 customer portraits'
          git push origin HEAD:work/DraBornGo-LastMile-v0.6-customer-pool
