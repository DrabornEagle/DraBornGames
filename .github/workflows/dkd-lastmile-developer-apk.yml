name: DKD Last Mile Developer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'DraBornGo-LastMile/App.tsx'
      - 'DraBornGo-LastMile/app.json'
      - 'DraBornGo-LastMile/index.js'
      - 'DraBornGo-LastMile/package.json'
      - 'DraBornGo-LastMile/package-lock.json'
      - 'DraBornGo-LastMile/assets/**'
      - 'DraBornGo-LastMile/game/**'
      - 'DraBornGo-LastMile/scripts/**'
      - 'DraBornGo-LastMile/src/**'
      - 'DraBornGo-LastMile/tests/**'
      - '.github/workflows/dkd-lastmile-developer-apk.yml'

permissions:
  contents: read

concurrency:
  group: dkd_lastmile_developer_apk_${{ github.ref }}
  cancel-in-progress: true

jobs:
  dkd_build_developer_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    defaults:
      run:
        working-directory: DraBornGo-LastMile

    steps:
      - name: dkd_checkout
        uses: actions/checkout@v4

      - name: dkd_setup_node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DraBornGo-LastMile/package-lock.json

      - name: dkd_setup_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: dkd_install_dependencies
        run: npm ci --no-audit --no-fund

      - name: dkd_render_game_bundle
        run: npm run build:game

      - name: dkd_run_tests
        run: npm test

      - name: dkd_typecheck
        run: npm run typecheck

      - name: dkd_expo_config_check
        run: npx expo config --type public >/dev/null

      - name: dkd_prebuild_android
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      # assembleDebug intentionally does not embed the JS bundle and therefore
      # requires Metro on the device. For a phone-installable developer build we
      # build the release variant, which embeds index.android.bundle. Expo's
      # generated Android project signs this test variant with its generated
      # debug signing config; the private production keystore is not used here.
      - name: dkd_build_standalone_developer_apk
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: dkd_verify_embedded_js_bundle
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -q 'assets/index.android.bundle'
          echo 'Standalone APK contains assets/index.android.bundle; Metro is not required.'

      - name: dkd_prepare_artifact
        run: |
          mkdir -p dkd-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk dkd-artifacts/DraBornGo-LastMile-v0.7-developer.apk
          sha256sum dkd-artifacts/DraBornGo-LastMile-v0.7-developer.apk | tee dkd-artifacts/DraBornGo-LastMile-v0.7-developer.sha256

      - name: dkd_upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: dkd_lastmile_v07_developer_apk
          path: |
            DraBornGo-LastMile/dkd-artifacts/DraBornGo-LastMile-v0.7-developer.apk
            DraBornGo-LastMile/dkd-artifacts/DraBornGo-LastMile-v0.7-developer.sha256
          if-no-files-found: error
          retention-days: 30
