name: DKD Last Mile v0.6.1 finalize

on:
  push:
    branches:
      - work/DraBornGo-LastMile-v0.6.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dkd-lastmile-v061-finalize
  cancel-in-progress: true

jobs:
  dkd-v061-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DraBornGo-LastMile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DraBornGo-LastMile/package-lock.json
      - name: Apply v0.6.1 source finalizer
        run: node scripts/dkd-v061-finalize-source.mjs
      - name: Align lockfile release version
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version = pkg.version;
          if (lock.packages?.['']) lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run build:game
      - run: npm test
      - run: npm run typecheck
      - name: Expo SDK 57 compatibility
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: Android JavaScript export - no APK
        run: npx expo export --platform android --output-dir .dkd-v061-export
      - name: Source hygiene
        run: git diff --check
      - name: Commit v0.6.1 finalized source and generated bundle
        run: |
          rm -rf .dkd-v061-export
          git config user.name 'DKD Last Mile Bot'
          git config user.email 'dkd-lastmile-bot@users.noreply.github.com'
          git add App.tsx app.json package.json package-lock.json scripts/dkd-build-game.mjs scripts/dkd-v061-finalize-source.mjs game/dkd-v061-release.mjs game/models/v061 assets/dkd-lastmile.html src/generated/dkd-game-html.ts
          if git diff --cached --quiet; then
            echo 'v0.6.1 source and generated bundle already current.'
            exit 0
          fi
          git commit -m 'release(lastmile): finalize v0.6.1 Expo Go source'
          git push origin HEAD:${{ github.ref_name }}