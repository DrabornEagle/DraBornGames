name: DKD Last Mile checks
on:
  push:
    branches: [main]
    paths:
      - 'DraBornGo-LastMile/App.tsx'
      - 'DraBornGo-LastMile/app.json'
      - 'DraBornGo-LastMile/package.json'
      - 'DraBornGo-LastMile/package-lock.json'
      - 'DraBornGo-LastMile/tsconfig.json'
      - 'DraBornGo-LastMile/game/**'
      - 'DraBornGo-LastMile/scripts/**'
      - 'DraBornGo-LastMile/src/**'
      - 'DraBornGo-LastMile/assets/**'
      - 'DraBornGo-LastMile/supabase/**'
      - 'DraBornGo-LastMile/tests/**'
      - '.github/workflows/dkd-lastmile-check.yml'
      - '.github/workflows/dkd-lastmile-autogen.yml'
  pull_request:
    paths:
      - 'DraBornGo-LastMile/App.tsx'
      - 'DraBornGo-LastMile/app.json'
      - 'DraBornGo-LastMile/package.json'
      - 'DraBornGo-LastMile/package-lock.json'
      - 'DraBornGo-LastMile/tsconfig.json'
      - 'DraBornGo-LastMile/game/**'
      - 'DraBornGo-LastMile/scripts/**'
      - 'DraBornGo-LastMile/src/**'
      - 'DraBornGo-LastMile/assets/**'
      - 'DraBornGo-LastMile/supabase/**'
      - 'DraBornGo-LastMile/tests/**'
      - '.github/workflows/dkd-lastmile-check.yml'
      - '.github/workflows/dkd-lastmile-autogen.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dkd-lastmile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dkd-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DraBornGo-LastMile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DraBornGo-LastMile/package-lock.json
      - name: Render v0.7 original soundtrack
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 scripts/dkd-render-music-v07.py --force
      - name: Generate starter mesh report
        run: node scripts/dkd-v07-model-report.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build:game
      - name: Generated bundle is deterministic
        run: |
          sha256sum assets/dkd-lastmile.html src/generated/dkd-game-html.ts > "$RUNNER_TEMP/dkd-generated-before.sha256"
          npm run build:game
          sha256sum assets/dkd-lastmile.html src/generated/dkd-game-html.ts > "$RUNNER_TEMP/dkd-generated-after.sha256"
          diff -u "$RUNNER_TEMP/dkd-generated-before.sha256" "$RUNNER_TEMP/dkd-generated-after.sha256"
      - name: Report pending autogen output
        run: |
          if ! git diff --quiet -- package-lock.json assets/dkd-lastmile.html src/generated/dkd-game-html.ts game/audio game/models/v061/dkd-v061-mesh-report.json; then
            echo '::notice::Generated output differs from checkout. DKD Last Mile autogen owns and commits these deterministic files.'
          fi
      - run: npm test
      - run: npm run typecheck
      - name: Expo SDK dependency versions
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: Android JavaScript export (no APK)
        run: EXPO_OFFLINE=1 npx expo export --platform android --output-dir dist-android
