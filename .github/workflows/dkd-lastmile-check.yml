name: DKD Last Mile v0.7.5 checks

on:
  push:
    branches:
      - main
    paths:
      - 'LastMile/**'
      - '.github/workflows/dkd-lastmile-check.yml'
  pull_request:
    paths:
      - 'LastMile/**'
      - '.github/workflows/dkd-lastmile-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dkd-lastmile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dkd-check:
    name: Expo Go candidate and shared-source verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LastMile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: LastMile/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build v0.7.5 shared game package
        run: npm run build:game

      - name: Generated files match source
        run: git diff --exit-code -- assets/dkd-lastmile.html src/generated/dkd-game-html.ts

      - name: Run tests
        run: npm test

      - name: TypeScript validation
        run: npm run typecheck

      - name: Expo SDK 57 dependency validation
        run: EXPO_OFFLINE=1 npx expo install --check

      - name: Android JavaScript export smoke test without APK
        run: EXPO_OFFLINE=1 npx expo export --platform android --output-dir dist-android-js

      - name: Web shared-source smoke test only - no deployment
        run: npm run build:web

      - name: Repository whitespace check
        working-directory: .
        run: git diff --check
