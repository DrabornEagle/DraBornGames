# DraBornGo / Last Mile v0.7 Expo Go bundle generation and verification
name: DKD Last Mile autogen

on:
  push:
    branches:
      - main
    paths:
      - 'DraBornGo-LastMile/game/**'
      - 'DraBornGo-LastMile/tests/**'
      - 'DraBornGo-LastMile/scripts/dkd-build-game.mjs'
      - 'DraBornGo-LastMile/scripts/dkd-build-game-v07.mjs'
      - 'DraBornGo-LastMile/scripts/dkd-render-music-v07.py'
      - 'DraBornGo-LastMile/package.json'
      - 'DraBornGo-LastMile/app.json'
      - '.github/workflows/dkd-lastmile-autogen.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dkd-lastmile-autogen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dkd-autogen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: DraBornGo-LastMile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DraBornGo-LastMile/package-lock.json

      - name: Install ffmpeg for v0.7 soundtrack renderer
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi

      - name: Render v0.7 MP3 soundtrack from scratch
        run: python3 scripts/dkd-render-music-v07.py

      - name: Refresh lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - run: npm ci --no-audit --no-fund
      - run: npm run build:game
      - run: npm test
      - run: npm run typecheck

      - name: Expo SDK dependency versions
        run: EXPO_OFFLINE=1 npx expo install --check

      - name: JavaScript whitespace check
        run: git diff --check

      - name: Commit deterministic generated files
        run: |
          git config user.name 'DKD Last Mile Bot'
          git config user.email 'dkd-lastmile-bot@users.noreply.github.com'
          git add package-lock.json assets/dkd-lastmile.html src/generated/dkd-game-html.ts game/audio/*.mp3
          if git diff --cached --quiet; then
            echo 'Generated files already current.'
            exit 0
          fi
          git commit -m 'build(lastmile): regenerate v0.7 Expo Go bundle'
          git push origin HEAD:${{ github.ref_name }}
