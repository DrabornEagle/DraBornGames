# DraBornGo / Last Mile v0.7 Expo Go bundle generation
# Renders the deterministic v0.7 soundtrack, rebuilds the WebView game bundle,
# validates SDK 57 compatibility and commits generated artifacts back to the branch.
name: DKD Last Mile autogen

on:
  push:
    branches:
      - main
      - work/DraBornGo-LastMile-v0.5
      - work/DraBornGo-LastMile-v0.5-garage-hotfix
      - work/DraBornGo-LastMile-v0.5-capacity-flow
      - work/DraBornGo-LastMile-v0.5-roadwork-audio
      - work/DraBornGo-LastMile-v0.5-city-audio-sign
      - work/DraBornGo-LastMile-v0.5-palm-roadedge-fix
      - work/DraBornGo-LastMile-v0.5-sign-layout-2
      - work/DraBornGo-LastMile-v0.5-live-season
      - work/DraBornGo-LastMile-v0.6
      - work/DraBornGo-LastMile-v0.6-customer-pool
      - work/DraBornGo-LastMile-v0.6.2
      - work/DraBornGo-LastMile-v0.7
    paths:
      - 'DraBornGo-LastMile/game/**'
      - 'DraBornGo-LastMile/tests/**'
      - 'DraBornGo-LastMile/scripts/dkd-build-game.mjs'
      - 'DraBornGo-LastMile/scripts/dkd-render-music.py'
      - 'DraBornGo-LastMile/scripts/dkd-render-music-v07.py'
      - 'DraBornGo-LastMile/scripts/dkd-v07-model-report.mjs'
      - 'DraBornGo-LastMile/package.json'
      - 'DraBornGo-LastMile/app.json'
      - '.github/workflows/dkd-lastmile-autogen.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dkd-lastmile-autogen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dkd-autogen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: DraBornGo-LastMile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DraBornGo-LastMile/package-lock.json
      - name: Keep lockfile package version aligned
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (lock.packages && lock.packages['']) lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Render v0.7 original game soundtrack
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python3 scripts/dkd-render-music-v07.py --force
      - name: Generate starter mesh report
        run: node scripts/dkd-v07-model-report.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build:game
      - run: npm test
      - run: npm run typecheck
      - name: Expo SDK dependency versions
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: JavaScript whitespace check
        run: git diff --check
      - name: Commit deterministic generated files
        run: |
          git config user.name 'DKD Last Mile Bot'
          git config user.email 'dkd-lastmile-bot@users.noreply.github.com'
          git add package-lock.json assets/dkd-lastmile.html src/generated/dkd-game-html.ts game/audio/*.mp3 game/models/v061/dkd-v061-mesh-report.json
          if git diff --cached --quiet; then
            echo 'Generated files already current.'
            exit 0
          fi
          git commit -m 'build(lastmile): regenerate v0.7 Expo Go bundle'
          git push origin HEAD:${{ github.ref_name }}
