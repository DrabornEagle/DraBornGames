name: DKD Last Mile v0.7.5 Expo candidate

on:
  push:
    branches:
      - main
      - 'work/lastmile-*'
    paths:
      - 'LastMile/game/**'
      - 'LastMile/tests/**'
      - 'LastMile/scripts/dkd-build-game.mjs'
      - 'LastMile/scripts/dkd-build-game-v07.mjs'
      - 'LastMile/scripts/dkd-generate-android-icon.py'
      - 'LastMile/supabase/functions/dkd-last-mile-api/**'
      - 'LastMile/package.json'
      - 'LastMile/app.json'
      - '.github/workflows/dkd-lastmile-autogen.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dkd-lastmile-autogen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dkd-autogen:
    name: Regenerate Expo Go game package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LastMile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: LastMile/package-lock.json
      - name: Generate deterministic Last Mine Android icon
        run: python3 scripts/dkd-generate-android-icon.py
      - name: Align lockfile with v0.7.5 package metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Android shared game package
        run: npm run build:game
      - name: Run tests
        run: npm test
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo SDK 57 dependency validation
        run: EXPO_OFFLINE=1 npx expo install --check
      - name: Repository whitespace check
        working-directory: .
        run: git diff --check
      - name: Commit deterministic generated Expo files
        run: |
          set -euo pipefail
          git config user.name 'DKD Last Mile Bot'
          git config user.email 'dkd-lastmile-bot@users.noreply.github.com'
          git add package-lock.json assets/dkd-lastmile.html assets/dkd-last-mine-icon.png src/generated/dkd-game-html.ts
          if git diff --cached --quiet; then
            echo 'Generated files already current.'
            exit 0
          fi
          git commit -m 'build(lastmile): regenerate v0.7.5 Expo candidate'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
