name: DKD Last Mile v0.7.2 audio bootstrap

on:
  push:
    branches:
      - work/lastmile-v0.7.2
    paths:
      - '.github/workflows/dkd-audio-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dkd-audio-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/lastmile-v0.7.2
          fetch-depth: 0

      - name: Download verified mobile MP3 masters
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_38eJOo5S2qdRoP5Q1BXMOZD5Qig/a101bdf0-9278-4809-a4f4-a406bc3f1bf6.mp3' -o LastMile/game/audio/InnerLight.mp3
          curl --fail --location --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_38eJOo5S2qdRoP5Q1BXMOZD5Qig/6d59f034-3949-498b-b958-ed50be18b221.mp3' -o LastMile/game/audio/SeMeNota.mp3
          test "$(wc -c < LastMile/game/audio/InnerLight.mp3)" = '1036016'
          test "$(wc -c < LastMile/game/audio/SeMeNota.mp3)" = '705104'
          echo '02bfa5d67476fb20394f8b744d1391f79ba91244bb81ba6e5e68f1e30a5d805a  LastMile/game/audio/InnerLight.mp3' | sha256sum --check
          echo '5cd31ddb67ddf011df1bc924d9faaf20f18e346cde6cc147f5e57f65f93647e4  LastMile/game/audio/SeMeNota.mp3' | sha256sum --check

      - name: Update manifest and remove temporary transfer files
        run: |
          set -euo pipefail
          cat > LastMile/game/audio/dkd-v072-audio.json <<'JSON'
          {
            "dkd_version": "0.7.2",
            "dkd_codec": "audio/mpeg",
            "dkd_profile": "mobile-web-optimized-mono-32khz-32kbps",
            "dkd_source": "user-supplied-mp3-mobile-encode",
            "dkd_tracks": [
              {"dkd_file":"audio/InnerLight.mp3","dkd_name":"InnerLight","dkd_sub":"Kurye Merkezi · Ana Menü","dkd_bpm":120,"dkd_mode":"menu","dkd_bytes":1036016,"dkd_sha256":"02bfa5d67476fb20394f8b744d1391f79ba91244bb81ba6e5e68f1e30a5d805a"},
              {"dkd_file":"audio/SeMeNota.mp3","dkd_name":"SeMeNota","dkd_sub":"Vardiya · Sürüş","dkd_bpm":128,"dkd_mode":"drive","dkd_bytes":705104,"dkd_sha256":"5cd31ddb67ddf011df1bc924d9faaf20f18e346cde6cc147f5e57f65f93647e4"}
            ]
          }
          JSON
          rm -rf LastMile/game/audio/v072
          cat > LastMile/game/audio/README.md <<'MD'
          # LastMile v0.7.2 — Müzik

          Oyunda yalnızca iki gerçek MP3 müzik parçası bulunur:

          - `InnerLight.mp3` — Kurye Merkezi ve ana menü.
          - `SeMeNota.mp3` — aktif vardiya ve sürüş.

          Telefon/WebView paket boyutunu düşük tutmak için kullanıcı tarafından sağlanan MP3 kaynakları 32 kHz mono / 32 kbps mobil oyun kopyasına dönüştürülmüştür. Derleme boyut ve SHA-256 değerlerini doğrular; eski prosedürel ve v0.5 müzikleri kullanılmaz.
          MD
          rm -f .github/workflows/dkd-audio-bootstrap.yml

      - name: Commit real audio binaries
        run: |
          set -euo pipefail
          git config user.name 'DKD Last Mile Bot'
          git config user.email 'dkd-lastmile-bot@users.noreply.github.com'
          git add -A LastMile/game/audio .github/workflows/dkd-audio-bootstrap.yml
          git commit -m 'feat(lastmile): install verified InnerLight and SeMeNota MP3s'
          git push origin HEAD:work/lastmile-v0.7.2
